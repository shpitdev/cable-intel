name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".codex/**"
      - ".opencode/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".codex/**"
      - ".opencode/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v5

      - name: Verify toolchain
        run: |
          node --version
          bun --version
          test "$(bun --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Cache dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun x ultracite check

      - name: Types
        run: bun run check-types

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: TUI compile smoke
        run: |
          bun run --cwd apps/tui build:bin
          ./apps/tui/dist/cable-intel-tui --help

      - name: Install browser
        run: bunx --no-install agent-browser install --with-deps

      - name: Browser smoke
        run: bun run qa:browser -- --skip-build

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-qa/**
          if-no-files-found: warn
